services:
  - type: web
    name: carbontrack-logistics
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: carbontrack-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DEV_MODE
        value: "false"
      - key: AUTO_MIGRATE
        value: "false"
      - key: SEED_DEFAULT_SETTINGS
        value: "true"
      - key: RATELIMIT_STORAGE_URI
        value: memory://

databases:
  - name: carbontrack-db
    databaseName: carbontrack
    user: carbontrack
    plan: free
